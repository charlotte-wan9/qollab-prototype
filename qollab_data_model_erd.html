
<div id="erd" style="padding: 1rem 0"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
  USER ||--o{ SHOW_MEMBERSHIP : "joins"
  SHOW ||--o{ SHOW_MEMBERSHIP : "has"
  SHOW ||--o{ SCRIPT_BLOCK : "contains"
  SHOW ||--|| LIGHTING_PLOT : "has one"
  SCRIPT_BLOCK ||--o{ CUE : "anchors"
  CUE ||--o{ CUE_ELEMENT : "composed of"
  CUE ||--o{ SUGGESTION : "receives"
  CUE ||--o{ MENTION : "notifies"
  SUGGESTION ||--o{ SUGGESTION_REPLY : "has thread"
  SHOW_MEMBERSHIP ||--o{ MENTION : "tagged in"
  LIGHTING_PLOT ||--o{ FIXTURE : "contains"
  FIXTURE }o--o{ CUE_ELEMENT : "referenced by"

  USER {
    uuid id PK
    string email
    string display_name
    string avatar_url
    timestamp created_at
  }

  SHOW {
    uuid id PK
    string title
    string join_password
    string join_link_slug
    uuid owner_id FK
    timestamp created_at
  }

  SHOW_MEMBERSHIP {
    uuid id PK
    uuid show_id FK
    uuid user_id FK
    enum role
    timestamp joined_at
  }

  SCRIPT_BLOCK {
    uuid id PK
    uuid show_id FK
    int order_index
    string act_label
    string scene_label
    text line_text
  }

  CUE {
    uuid id PK
    uuid show_id FK
    uuid script_block_id FK
    float cue_number
    enum status
    int designer_confidence
    string ai_description
    string ai_preview_url
    timestamp updated_at
  }

  CUE_ELEMENT {
    uuid id PK
    uuid cue_id FK
    uuid fixture_id FK
    enum fixture_type
    string gel_color
    string gel_code
    int intensity
    string focus_area
    string notes
  }

  SUGGESTION {
    uuid id PK
    uuid cue_id FK
    uuid author_membership_id FK
    text body
    text rationale
    int strength
    enum status
    timestamp created_at
  }

  SUGGESTION_REPLY {
    uuid id PK
    uuid suggestion_id FK
    uuid author_membership_id FK
    text body
    enum action
    timestamp created_at
  }

  MENTION {
    uuid id PK
    uuid cue_id FK
    uuid membership_id FK
    text rationale
    boolean acknowledged
    timestamp created_at
  }

  LIGHTING_PLOT {
    uuid id PK
    uuid show_id FK
    string file_url
    jsonb grid_data
    timestamp updated_at
  }

  FIXTURE {
    uuid id PK
    uuid plot_id FK
    enum fixture_type
    float grid_x
    float grid_y
    int angle
    string label
    string channel
  }
`);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
